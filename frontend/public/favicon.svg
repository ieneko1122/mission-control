<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 黒背景 -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#03070a"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="10" fill="none" stroke="#0a3d2e" stroke-width="1.5"/>

  <!-- ネオングリーンの [M] -->
  <text x="32" y="34"
        font-family="'Courier New', Courier, monospace"
        font-size="34" font-weight="bold"
        fill="#00ffaa" filter="url(#neon)"
        text-anchor="middle" dominant-baseline="central"
        letter-spacing="-1">[M]</text>
</svg>
